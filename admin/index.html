<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Dubai Approval Services</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../images/dubai-approvals.png">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Source Sans Pro',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:20px}
        .login-container{width:100%;max-width:420px}
        .login-card{background:#fff;border-radius:24px;padding:50px 40px;box-shadow:0 25px 80px rgba(0,0,0,0.3);transition:all 0.3s}
        .login-header{text-align:center;margin-bottom:35px}
        .login-logo{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,#c19a3e,#d4af37);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(193,154,62,0.3)}
        .login-logo img{width:60px;height:60px;object-fit:contain}
        .login-header h1{font-size:1.8rem;color:#1a1a2e;margin-bottom:8px}
        .login-header p{color:#777;font-size:0.95rem}
        .form-group{margin-bottom:22px}
        .form-group label{display:block;margin-bottom:8px;font-weight:600;color:#333;font-size:0.9rem}
        .input-wrapper{position:relative}
        .input-wrapper i.field-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#aaa;font-size:1.1rem}
        .form-group input{width:100%;padding:15px 50px 15px 50px;border:2px solid #e0e0e0;border-radius:12px;font-size:1rem;transition:all 0.3s;font-family:inherit}
        .form-group input:focus{border-color:#c19a3e;outline:none;box-shadow:0 0 0 4px rgba(193,154,62,0.1)}
        .pass-toggle{position:absolute;right:15px;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;cursor:pointer;font-size:1.1rem;padding:5px}
        .pass-toggle:hover{color:#c19a3e}
        .form-options{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:0.9rem}
        .remember-me{display:flex;align-items:center;gap:8px;color:#555}
        .remember-me input{width:18px;height:18px;cursor:pointer}
        .forgot-link{color:#c19a3e;font-weight:600;cursor:pointer;text-decoration:none;background:none;border:none;font-size:0.9rem;font-family:inherit}
        .forgot-link:hover{text-decoration:underline}
        .login-btn{width:100%;padding:16px;background:linear-gradient(135deg,#c19a3e,#d4af37);color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 15px rgba(193,154,62,0.3);font-family:inherit}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(193,154,62,0.4)}
        .login-btn:disabled{opacity:0.7;cursor:not-allowed;transform:none}
        .back-link{display:block;text-align:center;margin-top:25px;color:#777;font-size:0.9rem}
        .back-link a,.back-link button{color:#c19a3e;font-weight:600;margin-left:5px;text-decoration:none;background:none;border:none;cursor:pointer;font-size:0.9rem;font-family:inherit}
        .back-link a:hover,.back-link button:hover{text-decoration:underline}
        .msg{padding:12px 15px;border-radius:10px;margin-bottom:20px;font-size:0.9rem;display:none;text-align:center}
        .msg.show{display:block}
        .msg-error{background:#ffebee;color:#c62828}
        .msg-success{background:#e8f5e9;color:#2e7d32}
        .msg-info{background:#e3f2fd;color:#1565c0}

        /* OTP Input Group */
        .otp-group{display:flex;gap:10px;justify-content:center;margin:20px 0}
        .otp-group input{width:48px;height:56px;text-align:center;font-size:1.5rem;font-weight:700;border:2px solid #e0e0e0;border-radius:12px;font-family:monospace;padding:0;transition:all 0.3s}
        .otp-group input:focus{border-color:#c19a3e;outline:none;box-shadow:0 0 0 4px rgba(193,154,62,0.1)}
        .otp-timer{text-align:center;color:#888;font-size:0.85rem;margin-top:10px}
        .otp-timer strong{color:#c19a3e}
        .resend-btn{background:none;border:none;color:#c19a3e;font-weight:600;cursor:pointer;font-size:0.85rem;font-family:inherit;margin-top:5px}
        .resend-btn:disabled{color:#ccc;cursor:not-allowed}

        /* Step transitions */
        .step{display:none}
        .step.active{display:block;animation:fadeIn 0.4s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        /* Password strength */
        .strength-bar{height:4px;border-radius:4px;background:#e0e0e0;margin-top:8px;overflow:hidden}
        .strength-bar .fill{height:100%;border-radius:4px;transition:width 0.3s,background 0.3s;width:0%}
        .strength-text{font-size:0.75rem;margin-top:4px;color:#888}

        /* Admin utility classes */
        .admin-text-brand{color:#c19a3e}
        .admin-otp-info{text-align:center;color:#555;margin-bottom:20px;font-size:0.95rem}
        .admin-otp-center{text-align:center;margin-top:5px}
        .admin-mt20{margin-top:20px}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"><img src="../images/dubai-approvals.png" alt="Logo"></div>
                <h1 id="pageTitle">Admin Login</h1>
                <p id="pageSubtitle">Dubai Approval Services - Admin Panel</p>
            </div>

            <!-- Message area -->
            <div class="msg" id="msgBox"></div>

            <!-- STEP 1: LOGIN -->
            <div class="step active" id="stepLogin">
                <form id="loginForm" onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope field-icon"></i>
                            <input type="email" id="email" placeholder="admin@dubaiapprovalservices.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock field-icon"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" class="pass-toggle" onclick="togglePass('password',this)" title="Toggle password visibility"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember-me"><input type="checkbox" id="remember"> Remember me</label>
                        <button type="button" class="forgot-link" onclick="showStep('stepForgot')">Forgot Password?</button>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                </form>
                <p class="back-link">Go back to<a href="../">Website</a></p>
            </div>

            <!-- STEP 2: FORGOT PASSWORD - Enter Email -->
            <div class="step" id="stepForgot">
                <form onsubmit="return sendOTP(event)">
                    <div class="form-group">
                        <label>Enter your admin email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope field-icon"></i>
                            <input type="email" id="forgotEmail" placeholder="admin@dubaiapprovalservices.com" required>
                        </div>
                    </div>
                    <button type="submit" class="login-btn" id="sendOtpBtn"><i class="fas fa-paper-plane"></i> Send OTP</button>
                </form>
                <p class="back-link"><button type="button" onclick="showStep('stepLogin')"><i class="fas fa-arrow-left"></i> Back to Login</button></p>
            </div>

            <!-- STEP 3: ENTER OTP -->
            <div class="step" id="stepOTP">
                <form onsubmit="return verifyOTP(event)">
                    <p class="admin-otp-info">Enter the 6-digit code sent to<br><strong id="maskedEmail" class="admin-text-brand">your email</strong></p>
                    <div class="otp-group" id="otpGroup">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" data-index="0" autofocus>
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" data-index="1">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" data-index="2">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" data-index="3">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" data-index="4">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" data-index="5">
                    </div>
                    <div class="otp-timer">Expires in <strong id="otpTimer">10:00</strong></div>
                    <div class="admin-otp-center">
                        <button type="button" class="resend-btn" id="resendBtn" onclick="resendOTP()" disabled>Resend OTP (<span id="resendTimer">60</span>s)</button>
                    </div>
                    <button type="submit" class="login-btn" id="verifyOtpBtn" class="admin-mt20"><i class="fas fa-shield-alt"></i> Verify OTP</button>
                </form>
                <p class="back-link"><button type="button" onclick="showStep('stepForgot')"><i class="fas fa-arrow-left"></i> Change Email</button></p>
            </div>

            <!-- STEP 4: RESET PASSWORD -->
            <div class="step" id="stepReset">
                <form onsubmit="return resetPassword(event)">
                    <div class="form-group">
                        <label>New Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock field-icon"></i>
                            <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6" oninput="checkStrength(this.value)">
                            <button type="button" class="pass-toggle" onclick="togglePass('newPassword',this)" title="Toggle password visibility"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="strength-bar"><div class="fill" id="strengthFill"></div></div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock field-icon"></i>
                            <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                            <button type="button" class="pass-toggle" onclick="togglePass('confirmPassword',this)" title="Toggle password visibility"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="login-btn" id="resetBtn"><i class="fas fa-key"></i> Reset Password</button>
                </form>
            </div>
        </div>
    </div>

<script>
var resetToken = '';
var forgotEmailAddr = '';
var otpTimerInterval, resendTimerInterval;

// =========================================
// Login Handler (checks server-stored custom passwords too)
// =========================================
function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var loginBtn = document.getElementById('loginBtn');
    hideMsg();

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    // Try users API first (managed users with hashed passwords)
    fetch('api/users.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'action=login&email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
        if (res.success && res.user) {
            doLogin(res.user.email, res.user.name, res.user.role);
        } else {
            // Fallback: try check-password.php (for forgot-password reset)
            return fetch('api/check-password.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password)
            }).then(function(r) { return r.json(); }).then(function(res2) {
                if (res2.success) {
                    doLogin(email, 'Admin', 'admin');
                } else {
                    showMsg('Invalid email or password', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    document.getElementById('password').value = '';
                }
            });
        }
    })
    .catch(function() {
        showMsg('Cannot connect to server. Please check your connection.', 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    });
    return false;
}

function doLogin(email, name, role) {
    localStorage.setItem('das_admin_logged', 'true');
    localStorage.setItem('das_admin_user', JSON.stringify({name: name || 'Admin', email: email, role: role || 'admin'}));
    setTimeout(function() { window.location.href = 'dashboard'; }, 600);
}

// =========================================
// Forgot Password - Step 1: Send OTP
// =========================================
function sendOTP(e) {
    e.preventDefault();
    forgotEmailAddr = document.getElementById('forgotEmail').value.trim();
    var btn = document.getElementById('sendOtpBtn');
    hideMsg();

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending OTP...';

    fetch('api/forgot-password.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'action=send_otp&email=' + encodeURIComponent(forgotEmailAddr)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        if (res.success) {
            showMsg(res.message, 'success');
            if (res.masked_email) document.getElementById('maskedEmail').textContent = res.masked_email;
            showStep('stepOTP');
            startOTPTimer();
            startResendTimer();
            // Focus first OTP input
            document.querySelector('.otp-input[data-index="0"]').focus();
        } else {
            showMsg(res.message, 'error');
        }
    })
    .catch(function() {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        showMsg('Failed to connect to server. Check your connection.', 'error');
    });
    return false;
}

// =========================================
// Forgot Password - Step 2: Verify OTP
// =========================================
function verifyOTP(e) {
    e.preventDefault();
    var otpInputs = document.querySelectorAll('.otp-input');
    var otp = '';
    otpInputs.forEach(function(inp) { otp += inp.value; });

    if (otp.length !== 6) {
        showMsg('Please enter the complete 6-digit OTP', 'error');
        return false;
    }

    var btn = document.getElementById('verifyOtpBtn');
    hideMsg();
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

    fetch('api/forgot-password.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'action=verify_otp&email=' + encodeURIComponent(forgotEmailAddr) + '&otp=' + encodeURIComponent(otp)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-shield-alt"></i> Verify OTP';
        if (res.success) {
            resetToken = res.reset_token;
            showMsg(res.message, 'success');
            showStep('stepReset');
            clearInterval(otpTimerInterval);
        } else {
            showMsg(res.message, 'error');
            // Clear OTP inputs on wrong code
            otpInputs.forEach(function(inp) { inp.value = ''; });
            otpInputs[0].focus();
        }
    })
    .catch(function() {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-shield-alt"></i> Verify OTP';
        showMsg('Connection failed.', 'error');
    });
    return false;
}

// =========================================
// Forgot Password - Step 3: Reset Password
// =========================================
function resetPassword(e) {
    e.preventDefault();
    var newPass = document.getElementById('newPassword').value;
    var confirmPass = document.getElementById('confirmPassword').value;
    var btn = document.getElementById('resetBtn');
    hideMsg();

    if (newPass.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return false; }
    if (newPass !== confirmPass) { showMsg('Passwords do not match.', 'error'); return false; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

    fetch('api/forgot-password.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'action=reset_password&email=' + encodeURIComponent(forgotEmailAddr) + '&reset_token=' + encodeURIComponent(resetToken) + '&new_password=' + encodeURIComponent(newPass) + '&confirm_password=' + encodeURIComponent(confirmPass)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
        if (res.success) {
            showMsg(res.message, 'success');
            setTimeout(function() { showStep('stepLogin'); }, 2000);
        } else {
            showMsg(res.message, 'error');
        }
    })
    .catch(function() {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
        showMsg('Connection failed.', 'error');
    });
    return false;
}

function resendOTP() {
    document.getElementById('forgotEmail').value = forgotEmailAddr;
    sendOTP(new Event('submit'));
}

// =========================================
// OTP Input Behavior (auto-advance, backspace, paste)
// =========================================
document.querySelectorAll('.otp-input').forEach(function(input, idx) {
    input.addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value && idx < 5) {
            document.querySelector('.otp-input[data-index="'+(idx+1)+'"]').focus();
        }
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && idx > 0) {
            document.querySelector('.otp-input[data-index="'+(idx-1)+'"]').focus();
        }
    });
    input.addEventListener('paste', function(e) {
        e.preventDefault();
        var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').substring(0, 6);
        paste.split('').forEach(function(ch, i) {
            var inp = document.querySelector('.otp-input[data-index="'+i+'"]');
            if (inp) inp.value = ch;
        });
        if (paste.length > 0) {
            var lastIdx = Math.min(paste.length, 6) - 1;
            document.querySelector('.otp-input[data-index="'+lastIdx+'"]').focus();
        }
    });
});

// =========================================
// Timers
// =========================================
function startOTPTimer() {
    var seconds = 600; // 10 min
    clearInterval(otpTimerInterval);
    otpTimerInterval = setInterval(function() {
        seconds--;
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        document.getElementById('otpTimer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
        if (seconds <= 0) {
            clearInterval(otpTimerInterval);
            showMsg('OTP expired. Please request a new one.', 'error');
            showStep('stepForgot');
        }
    }, 1000);
}

function startResendTimer() {
    var seconds = 60;
    var btn = document.getElementById('resendBtn');
    var span = document.getElementById('resendTimer');
    btn.disabled = true;
    clearInterval(resendTimerInterval);
    resendTimerInterval = setInterval(function() {
        seconds--;
        span.textContent = seconds;
        if (seconds <= 0) {
            clearInterval(resendTimerInterval);
            btn.disabled = false;
            btn.innerHTML = 'Resend OTP';
        }
    }, 1000);
}

// =========================================
// Helpers
// =========================================
function showStep(stepId) {
    document.querySelectorAll('.step').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById(stepId).classList.add('active');
    hideMsg();

    var titles = {
        stepLogin: ['Admin Login', 'Dubai Approval Services - Admin Panel'],
        stepForgot: ['Forgot Password', 'Enter your registered admin email'],
        stepOTP: ['Verify OTP', 'Check your email inbox'],
        stepReset: ['Reset Password', 'Create a strong new password']
    };
    document.getElementById('pageTitle').textContent = titles[stepId][0];
    document.getElementById('pageSubtitle').textContent = titles[stepId][1];
}

function showMsg(text, type) {
    var box = document.getElementById('msgBox');
    box.className = 'msg msg-' + type + ' show';
    box.textContent = text;
}
function hideMsg() {
    document.getElementById('msgBox').className = 'msg';
}

function togglePass(inputId, btn) {
    var input = document.getElementById(inputId);
    var icon = btn.querySelector('i');
    if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
    else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
}

function checkStrength(val) {
    var fill = document.getElementById('strengthFill');
    var text = document.getElementById('strengthText');
    var score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;

    var colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#27ae60'];
    var labels = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
    var width = Math.min(score * 20, 100);
    fill.style.width = width + '%';
    fill.style.background = colors[Math.min(score, 4)];
    text.textContent = val.length > 0 ? labels[Math.min(score, 4)] : '';
    text.style.color = colors[Math.min(score, 4)];
}

// Redirect if already logged in
if (localStorage.getItem('das_admin_logged') === 'true') {
    window.location.href = 'dashboard';
}
</script>
</body>
</html>
